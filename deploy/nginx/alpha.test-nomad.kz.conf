server {
    listen 195.49.212.123:80;
    server_name alpha.test-nomad.kz;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 195.49.212.123:443 ssl http2;
    server_name alpha.test-nomad.kz;

    ssl_certificate     /etc/letsencrypt/live/alpha.test-nomad.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alpha.test-nomad.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    access_log /var/www/httpd-logs/alpha.test-nomad.kz.ssl.access.log;
    error_log  /var/www/httpd-logs/alpha.test-nomad.kz.ssl.error.log notice;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}
