<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Игрушки дома — mobile preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Manrope', sans-serif;
      background: #ece7de;
      color: #262626;
      padding: 16px;
    }
    .status-card {
      background: #FAF8F4;
      border-radius: 28px;
      padding: 20px 18px;
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 8px 24px rgba(0,0,0,0.02);
      max-width: 430px;
      margin: 0 auto;
    }
    .limit-card-title-mobile {
      margin: 0 0 8px;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.25;
    }
    .card-sub-info {
      font-size: 13px;
      color: #6F746F;
      margin: 2px 0 0;
    }
    .toys-thumb-row {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin: 14px 0 12px;
      width: 100%;
    }
    .toys-thumb-cell {
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #f1f5f9;
      border: 1px solid rgba(45, 42, 50, 0.08);
    }
    .toys-thumb-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .toys-thumb-more {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f1ea;
      color: #3f6757;
      font-weight: 800;
      font-size: 0.92rem;
    }
    .view-composition-btn-mobile {
      width: 100%;
      margin-top: 4px;
      padding: 12px 14px;
      border: 1px solid rgba(63, 103, 87, 0.22);
      border-radius: 14px;
      background: #fff;
      color: #3f6757;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      text-align: center;
    }
    .meta {
      text-align: center;
      font-size: 12px;
      color: #6F746F;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <p class="meta" id="wlabel">width preview</p>
  <div class="status-card limit-card">
    <h3 class="limit-card-title-mobile">Игрушки дома · 5 из 5</h3>
    <p class="card-sub-info">Следующая доставка: 12 октября</p>
    <p class="card-sub-info">Статус набора: У вас дома</p>
    <div class="toys-thumb-row" aria-label="Миниатюры состава">
      <div class="toys-thumb-cell"><img src="https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?auto=format&fit=crop&w=200&q=80" alt="" /></div>
      <div class="toys-thumb-cell"><img src="https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?auto=format&fit=crop&w=200&q=80" alt="" /></div>
      <div class="toys-thumb-cell"><img src="https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?auto=format&fit=crop&w=200&q=80" alt="" /></div>
      <div class="toys-thumb-cell"><img src="https://images.unsplash.com/photo-1558060370-d644479cb6f7?auto=format&fit=crop&w=200&q=80" alt="" /></div>
      <div class="toys-thumb-cell"><img src="https://images.unsplash.com/photo-1596870230751-ebdfce98bb63?auto=format&fit=crop&w=200&q=80" alt="" /></div>
    </div>
    <button type="button" class="view-composition-btn-mobile">Посмотреть состав · 5 игрушек</button>
  </div>
  <script>
    document.getElementById('wlabel').textContent = 'viewport ' + window.innerWidth + 'px'
  </script>
</body>
</html>
